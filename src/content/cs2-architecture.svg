<svg width="1100" height="680" viewBox="0 0 1100 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CS2 Match Analyst architecture: a terminal command drives a DSPy ReAct agent that reasons against a local Ollama model and acts by calling leetify-mcp, which is the only piece that reaches Leetify's public API over the open internet.">
  <title>CS2 Match Analyst architecture</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=Public+Sans:wght@400;500;600&amp;display=swap');
      text { font-family: 'Public Sans', system-ui, sans-serif; }
      .display { font-family: 'Sora', system-ui, sans-serif; }
    </style>
    <marker id="cs2-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2451D9"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="680" fill="#FFFFFF"/>

  <text x="60" y="52" class="display" font-weight="700" font-size="28" fill="#2451D9">CS2 Match Analyst Architecture</text>
  <text x="60" y="76" font-weight="400" font-size="13" fill="#5B5F66">Local agent, one call leaves the machine</text>

  <rect x="40" y="100" width="700" height="480" rx="18" fill="none" stroke="#B9C6E8" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="64" y="564" font-weight="600" font-size="11" letter-spacing="1" fill="#5B5F66">YOUR MACHINE</text>

  <!-- You -->
  <rect x="270" y="140" width="220" height="64" rx="10" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1.5"/>
  <text x="380" y="168" text-anchor="middle" class="display" font-weight="600" font-size="15" fill="#1A1A1A">You</text>
  <text x="380" y="188" text-anchor="middle" font-weight="400" font-size="11.5" fill="#5B5F66">terminal</text>

  <line x1="380" y1="204" x2="380" y2="266" stroke="#2451D9" stroke-width="2" marker-end="url(#cs2-arrow)"/>
  <line x1="380" y1="266" x2="380" y2="204" stroke="#2451D9" stroke-width="2" marker-end="url(#cs2-arrow)"/>
  <text x="392" y="222" font-weight="500" font-size="9.5" fill="#5B5F66">&#8595; analyze.py &lt;match_id&gt;</text>
  <text x="392" y="238" font-weight="500" font-size="9.5" fill="#5B5F66">&#8593; field report</text>

  <!-- Agent (highlighted) -->
  <rect x="230" y="270" width="300" height="90" rx="12" fill="#EEF2FC" stroke="#2451D9" stroke-width="2"/>
  <text x="380" y="304" text-anchor="middle" class="display" font-weight="700" font-size="16" fill="#2451D9">DSPy ReAct Agent</text>
  <text x="380" y="326" text-anchor="middle" font-weight="500" font-size="11.5" fill="#5B5F66">AnalyzeMatch &#183; max_iters = 8</text>

  <!-- self-loop -->
  <path d="M530,300 C 575,300 575,335 530,335" fill="none" stroke="#2451D9" stroke-width="1.5" marker-end="url(#cs2-arrow)"/>
  <text x="585" y="322" font-weight="500" font-size="9.5" fill="#5B5F66">loop, up to 8&#215;</text>

  <!-- branches to Ollama / leetify-mcp -->
  <text x="255" y="424" text-anchor="middle" font-weight="500" font-size="9.5" fill="#5B5F66">reason</text>
  <line x1="345" y1="360" x2="230" y2="458" stroke="#2451D9" stroke-width="1.5" marker-end="url(#cs2-arrow)"/>
  <text x="505" y="424" text-anchor="middle" font-weight="500" font-size="9.5" fill="#5B5F66">act &#183; call_tool()</text>
  <line x1="415" y1="360" x2="500" y2="458" stroke="#2451D9" stroke-width="1.5" marker-end="url(#cs2-arrow)"/>

  <!-- Ollama -->
  <rect x="110" y="460" width="190" height="64" rx="10" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1.5"/>
  <text x="205" y="488" text-anchor="middle" class="display" font-weight="600" font-size="14" fill="#1A1A1A">Ollama</text>
  <text x="205" y="507" text-anchor="middle" font-weight="400" font-size="11" fill="#5B5F66">Qwen2.5-14B &#183; local</text>

  <!-- leetify-mcp -->
  <rect x="380" y="460" width="190" height="64" rx="10" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1.5"/>
  <text x="475" y="488" text-anchor="middle" class="display" font-weight="600" font-size="14" fill="#1A1A1A">leetify-mcp</text>
  <text x="475" y="507" text-anchor="middle" font-weight="400" font-size="11" fill="#5B5F66">5 tools &#183; MCP</text>

  <!-- Leetify API (outside the dashed zone) -->
  <text x="910" y="438" text-anchor="middle" font-weight="600" font-size="11" letter-spacing="1" fill="#5B5F66">OPEN INTERNET</text>
  <rect x="800" y="460" width="220" height="64" rx="10" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1.5"/>
  <text x="910" y="488" text-anchor="middle" class="display" font-weight="600" font-size="14" fill="#1A1A1A">Leetify API</text>
  <text x="910" y="507" text-anchor="middle" font-weight="400" font-size="11" fill="#5B5F66">public &#183; off-machine</text>

  <line x1="570" y1="486" x2="796" y2="486" stroke="#2451D9" stroke-width="1.5" marker-end="url(#cs2-arrow)"/>
  <line x1="796" y1="500" x2="570" y2="500" stroke="#2451D9" stroke-width="1.5" marker-end="url(#cs2-arrow)"/>
  <text x="683" y="470" text-anchor="middle" font-weight="500" font-size="9.5" fill="#5B5F66">HTTPS &#183; 15s timeout</text>

  <text x="550" y="640" text-anchor="middle" font-weight="400" font-size="11" fill="#5B5F66">leetify-mcp is the only piece that reaches the open internet &#183; everything else stays on the machine</text>
</svg>
