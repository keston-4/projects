<svg width="1100" height="720" viewBox="0 0 1100 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OpenClaw architecture: a WhatsApp message reaches one of two agent containers on a shared VPS, each agent calling its own downstream tools before replying.">
  <title>OpenClaw architecture</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=Public+Sans:wght@400;500;600&amp;display=swap');
      text { font-family: 'Public Sans', system-ui, sans-serif; }
      .display { font-family: 'Sora', system-ui, sans-serif; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2451D9"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="720" fill="#FFFFFF"/>

  <text x="60" y="52" class="display" font-weight="700" font-size="28" fill="#2451D9">OpenClaw Architecture</text>
  <text x="60" y="76" font-weight="400" font-size="13" fill="#5B5F66">Two WhatsApp agents, one Hostinger VPS</text>

  <rect x="40" y="100" width="1020" height="580" rx="18" fill="none" stroke="#B9C6E8" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="64" y="664" font-weight="600" font-size="11" letter-spacing="1" fill="#5B5F66">HOSTINGER VPS</text>

  <!-- LEFT LANE: golf-chads -->
  <rect x="170" y="140" width="260" height="64" rx="10" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1.5"/>
  <text x="300" y="168" text-anchor="middle" class="display" font-weight="600" font-size="14" fill="#1A1A1A">WhatsApp Group</text>
  <text x="300" y="188" text-anchor="middle" font-weight="400" font-size="11.5" fill="#5B5F66">@mention required</text>

  <line x1="300" y1="204" x2="300" y2="242" stroke="#2451D9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="310" y="227" font-weight="500" font-size="9.5" fill="#5B5F66">message</text>

  <rect x="170" y="244" width="260" height="76" rx="10" fill="#EEF2FC" stroke="#2451D9" stroke-width="2"/>
  <text x="300" y="272" text-anchor="middle" class="display" font-weight="700" font-size="15" fill="#2451D9">bdy7</text>
  <text x="300" y="292" text-anchor="middle" font-weight="500" font-size="11.5" fill="#5B5F66">golf-chads agent</text>

  <line x1="300" y1="320" x2="300" y2="358" stroke="#2451D9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="310" y="343" font-weight="500" font-size="9.5" fill="#5B5F66">parses request</text>

  <rect x="170" y="360" width="260" height="60" rx="10" fill="#F3F4F6" stroke="#DADCE0" stroke-width="1.5"/>
  <text x="300" y="396" text-anchor="middle" class="display" font-weight="600" font-size="13" fill="#1A1A1A">golfnow-tee-times skill</text>

  <text x="300" y="437" text-anchor="middle" font-weight="500" font-size="9.5" fill="#5B5F66">queries</text>
  <line x1="300" y1="420" x2="185" y2="458" stroke="#2451D9" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="300" y1="420" x2="320" y2="458" stroke="#2451D9" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="300" y1="420" x2="455" y2="458" stroke="#2451D9" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="125" y="460" width="120" height="72" rx="8" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1.5"/>
  <text x="185" y="486" text-anchor="middle" class="display" font-weight="600" font-size="12" fill="#1A1A1A">SQLite</text>
  <text x="185" y="502" text-anchor="middle" font-weight="400" font-size="10.5" fill="#5B5F66">app.db</text>
  <text x="185" y="516" text-anchor="middle" font-weight="400" font-size="10" fill="#5B5F66">274 UK courses</text>

  <rect x="260" y="460" width="120" height="72" rx="8" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1.5"/>
  <text x="320" y="486" text-anchor="middle" class="display" font-weight="600" font-size="12" fill="#1A1A1A">GolfNow API</text>
  <text x="320" y="502" text-anchor="middle" font-weight="400" font-size="10.5" fill="#5B5F66">tee-time-results</text>
  <text x="320" y="516" text-anchor="middle" font-weight="400" font-size="10" fill="#5B5F66">REST endpoint</text>

  <rect x="395" y="460" width="120" height="72" rx="8" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1.5"/>
  <text x="455" y="486" text-anchor="middle" class="display" font-weight="600" font-size="12" fill="#1A1A1A">wttr.in</text>
  <text x="455" y="502" text-anchor="middle" font-weight="400" font-size="10.5" fill="#5B5F66">weather</text>
  <text x="455" y="516" text-anchor="middle" font-weight="400" font-size="10" fill="#5B5F66">by coordinates</text>

  <text x="300" y="560" text-anchor="middle" font-style="italic" font-weight="400" font-size="11" fill="#5B5F66">&#8594; reply sent back to WhatsApp</text>

  <!-- RIGHT LANE: personal-assistant -->
  <rect x="620" y="140" width="260" height="64" rx="10" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1.5"/>
  <text x="750" y="168" text-anchor="middle" class="display" font-weight="600" font-size="14" fill="#1A1A1A">WhatsApp DM</text>
  <text x="750" y="188" text-anchor="middle" font-weight="400" font-size="11.5" fill="#5B5F66">direct message only</text>

  <line x1="750" y1="204" x2="750" y2="242" stroke="#2451D9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="760" y="227" font-weight="500" font-size="9.5" fill="#5B5F66">message</text>

  <rect x="620" y="244" width="260" height="76" rx="10" fill="#EEF2FC" stroke="#2451D9" stroke-width="2"/>
  <text x="750" y="272" text-anchor="middle" class="display" font-weight="700" font-size="15" fill="#2451D9">ckov</text>
  <text x="750" y="292" text-anchor="middle" font-weight="500" font-size="11.5" fill="#5B5F66">personal-assistant agent</text>

  <text x="750" y="437" text-anchor="middle" font-weight="500" font-size="9.5" fill="#5B5F66">invokes</text>
  <line x1="750" y1="320" x2="665" y2="458" stroke="#2451D9" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="750" y1="320" x2="835" y2="458" stroke="#2451D9" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="590" y="460" width="150" height="72" rx="8" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1.5"/>
  <text x="665" y="488" text-anchor="middle" class="display" font-weight="600" font-size="12" fill="#1A1A1A">moonshot/kimi-k2.5</text>
  <text x="665" y="504" text-anchor="middle" font-weight="400" font-size="10.5" fill="#5B5F66">model</text>
  <text x="665" y="518" text-anchor="middle" font-weight="400" font-size="10" fill="#5B5F66">alias: kimi</text>

  <rect x="760" y="460" width="150" height="72" rx="8" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1.5"/>
  <text x="835" y="488" text-anchor="middle" class="display" font-weight="600" font-size="12" fill="#1A1A1A">General skills</text>
  <text x="835" y="504" text-anchor="middle" font-weight="400" font-size="10.5" fill="#5B5F66">no domain</text>
  <text x="835" y="518" text-anchor="middle" font-weight="400" font-size="10" fill="#5B5F66">restriction</text>

  <text x="750" y="560" text-anchor="middle" font-style="italic" font-weight="400" font-size="11" fill="#5B5F66">&#8594; reply sent back to WhatsApp</text>

  <text x="550" y="705" text-anchor="middle" font-weight="400" font-size="11" fill="#5B5F66">openclaw.json per container &#183; docker compose &#183; deploy.sh pushes over SSH</text>
</svg>
